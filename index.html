
    <script>
        /**
         * KINETIC DATA CORE
         */
        const CLUB_DATA = {
            team: {
                'mark-romanov': { name: 'Марк Романов', role: 'Head of CrossFit', img: 'https://images.unsplash.com/photo-1583465555627-142f3607fc8d?q=80&w=600', bio: 'Мастер спорта по пауэрлифтингу. 15 лет превращает людей в машины. Только хардкор.' },
                'ali-khan': { name: 'Али Хан', role: 'Combat Master', img: 'https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=600', bio: 'Действующий боец ММА (14-2). Постановка нокаутирующего удара и психология боя.' },
                'anna-weiss': { name: 'Д-р Анна Вейсс', role: 'Sports Medicine', img: 'https://images.unsplash.com/photo-1559839734-2b71ea197ec2?q=80&w=600', bio: 'Кандидат мед. наук. Реабилитация олимпийских сборных. Твой технадзор за телом.' },
                'sofia-lee': { name: 'Д-р София Ли', role: 'Endocrinology', img: 'https://images.unsplash.com/photo-1594824436951-7f12bc31b4b1?q=80&w=600', bio: 'Эксперт по биохакингу. Настройка метаболизма и гормонального фона под нагрузки.' }
            },
            disciplines: {
                'crossfit': { title: 'CrossFit', desc: 'Экстремальная система подготовки. Гимнастика, атлетика, кардио.' },
                'mma': { title: 'Fight Club', desc: 'Зона смешанных единоборств премиум-класса. Октагон и ударная техника.' },
                'personal': { title: 'Bio Personal', desc: 'Абсолютный фокус. Стратегия на основе генетики и биомеханики.' }
            }
        };

        /**
         * KINETIC ENGINE (SPA & Interactions)
         */
        const KineticEngine = {
            init() {
                this.initNavigation();
                this.initTabs();
                this.initModals();
                this.renderTeam();
                this.initForms();
            },

            initNavigation() {
                const triggers = document.querySelectorAll('.js-view-trigger');
                const views = document.querySelectorAll('.view');

                triggers.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.preventDefault();
                        const target = btn.dataset.target;
                        
                        triggers.forEach(t => t.classList.remove('active'));
                        btn.classList.add('active');

                        views.forEach(v => v.classList.remove('is-active'));
                        document.getElementById(target).classList.add('is-active');
                        window.scrollTo(0,0);
                    });
                });
            },

            initTabs() {
                const triggers = document.querySelectorAll('.tab-trigger');
                const panes = document.querySelectorAll('.tab-pane');

                triggers.forEach(t => {
                    t.addEventListener('click', () => {
                        triggers.forEach(btn => btn.classList.remove('active'));
                        panes.forEach(p => p.classList.remove('active'));
                        
                        t.classList.add('active');
                        document.getElementById(t.dataset.tab).classList.add('active');
                    });
                });
            },

            initModals() {
                const triggers = document.querySelectorAll('.js-modal-trigger');
                const closers = document.querySelectorAll('.js-modal-close');
                const specTriggers = document.querySelectorAll('.js-spec-trigger');

                triggers.forEach(btn => {
                    btn.addEventListener('click', () => {
                        const mId = btn.dataset.modal;
                        const service = btn.dataset.service || 'Персональный визит';
                        document.getElementById('modal-service-tag').innerText = `Service: ${service}`;
                        document.getElementById(mId).classList.add('is-open');
                        document.body.style.overflow = 'hidden';
                    });
                });

                document.body.addEventListener('click', (e) => {
                    const specBtn = e.target.closest('.js-spec-trigger');
                    if (specBtn) {
                        const id = specBtn.dataset.id;
                        this.openSpecModal(id);
                    }
                    
                    const discBtn = e.target.closest('.js-disc-trigger');
                    if (discBtn) {
                        const id = discBtn.dataset.id;
                        this.openDiscModal(id);
                    }
                });

                closers.forEach(c => {
                    c.addEventListener('click', () => {
                        document.querySelectorAll('.modal').forEach(m => m.classList.remove('is-open'));
                        document.body.style.overflow = 'auto';
                    });
                });
            },

            renderTeam() {
                const container = document.getElementById('team-container');
                if (!container) return;
                
                Object.entries(CLUB_DATA.team).forEach(([id, member]) => {
                    const el = document.createElement('div');
                    el.className = 'member js-spec-trigger';
                    el.dataset.id = id;
                    el.innerHTML = `
                        <img src="${member.img}" alt="${member.name}">
                        <div class="member-info">
                            <div class="member-role">${member.role}</div>
                            <div class="member-name">${member.name}</div>
                        </div>
                    `;
                    container.appendChild(el);
                });
            },

            openSpecModal(id) {
                const member = CLUB_DATA.team[id];
                const content = document.getElementById('spec-detail-content');
                content.innerHTML = `
                    <div class="modal-close js-modal-close"><i class="ph ph-x"></i></div>
                    <div class="member-role" style="font-size: 1.5rem;">Expert Profile</div>
                    <h2 class="form-title" style="margin-bottom: 1rem;">${member.name}</h2>
                    <p style="color: var(--c-orange); font-family: var(--f-head); text-transform: uppercase; margin-bottom: 2rem;">${member.role}</p>
                    <p style="font-size: 1.25rem; color: var(--c-text-muted); line-height: 1.8; margin-bottom: 3rem;">${member.bio}</p>
                    <button class="btn btn-fill js-book-from-spec" data-name="${member.name}">Назначить сессию с экспертом →</button>
                `;
                
                document.getElementById('modal-spec').classList.add('is-open');

                // Перехват клика внутри новой разметки
                content.querySelector('.js-book-from-spec').onclick = () => {
                    document.getElementById('modal-spec').classList.remove('is-open');
                    document.getElementById('modal-service-tag').innerText = `Service: Сессия с ${member.name}`;
                    document.getElementById('modal-book').classList.add('is-open');
                };
            },

            openDiscModal(id) {
                const disc = CLUB_DATA.disciplines[id];
                const content = document.getElementById('spec-detail-content');
                content.innerHTML = `
                    <div class="modal-close js-modal-close"><i class="ph ph-x"></i></div>
                    <div class="member-role" style="font-size: 1.5rem;">Discipline Protocol</div>
                    <h2 class="form-title" style="margin-bottom: 1rem;">${disc.title}</h2>
                    <p style="font-size: 1.25rem; color: var(--c-text-muted); line-height: 1.8; margin-bottom: 3rem;">${disc.desc}</p>
                    <button class="btn btn-fill js-book-from-spec">Запланировать вводный тренинг →</button>
                `;
                document.getElementById('modal-spec').classList.add('is-open');
            },

            initForms() {
                const form = document.getElementById('book-form');
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const btn = document.getElementById('form-submit-btn');
                    btn.disabled = true;
                    btn.innerHTML = `<span>Обработка...</span>`;

                    // MOCK ASYNC
                    await new Promise(r => setTimeout(r, 1500));
                    
                    btn.style.background = 'var(--c-green)';
                    btn.innerHTML = `<span>Принято. Ожидайте связи.</span>`;
                    
                    setTimeout(() => {
                        document.querySelectorAll('.modal').forEach(m => m.classList.remove('is-open'));
                        document.body.style.overflow = 'auto';
                        form.reset();
                        btn.disabled = false;
                        btn.style.background = '';
                        btn.innerHTML = `<span>Запланировать →</span>`;
                    }, 2000);
                });
            }
        };

        document.addEventListener('DOMContentLoaded', () => KineticEngine.init());
    </script>
</body>
</html>
