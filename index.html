<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KINETIC — Приватный фитнес-клуб</title>
  <meta name="description" content="KINETIC — закрытый клуб высокой производительности. Персональные программы, восстановление, биометрика. Только для резидентов."/>
  <style>
    :root {
      --bg: #070709;
      --text: #e0e0e0;
      --accent: #FF6B35;
      --teal: #00F5D4;
      --blue: #0A2463;
      --radius: 12px;
      --transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
    }
    .onboarding {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      text-align: center;
      padding: 2rem;
    }
    .onboarding h1 {
      font-size: 2rem;
      margin-bottom: 2rem;
    }
    .onboarding button {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 1rem 2rem;
      margin: 0.5rem;
      border-radius: var(--radius);
      cursor: pointer;
      transition: var(--transition);
    }
    .onboarding button:hover {
      background: var(--accent);
      color: white;
    }
    header {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      z-index: 100;
      background: rgba(7, 7, 9, 0.8);
      backdrop-filter: blur(10px);
    }
    .logo {
      font-weight: 700;
      color: white;
      text-shadow: 0 0 8px var(--accent);
    }
    nav a {
      color: var(--text);
      text-decoration: none;
      margin-left: 2rem;
    }
    section {
      padding: 6rem 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    .section-title {
      font-size: 2rem;
      text-align: center;
      color: var(--accent);
      margin-bottom: 3rem;
    }
    .team-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 2rem;
    }
    .team-card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .team-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }
    .team-info {
      padding: 1.5rem;
    }
    .team-info h3 {
      color: white;
    }
    .team-info p {
      color: #aaa;
      font-size: 0.9rem;
    }
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 300;
      padding: 2rem;
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      background: var(--bg);
      border: 1px solid rgba(255, 107, 53, 0.2);
      border-radius: var(--radius);
      max-width: 600px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      color: var(--text);
      font-size: 1.5rem;
      cursor: pointer;
    }
    .modal-body {
      padding: 2rem;
    }
    form {
      margin-top: 2rem;
    }
    input, textarea {
      width: 100%;
      padding: 0.8rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 107, 53, 0.3);
      border-radius: var(--radius);
      color: white;
      margin-bottom: 1rem;
    }
    button.cta {
      background: var(--accent);
      color: white;
      border: none;
      padding: 1rem 2rem;
      border-radius: var(--radius);
      cursor: pointer;
    }
    .form-feedback {
      margin-top: 1rem;
      padding: 1rem;
      border-radius: var(--radius);
      display: none;
    }
    .success {
      background: rgba(0, 245, 212, 0.2);
      color: var(--teal);
      display: block;
    }
    .error {
      background: rgba(255, 0, 0, 0.2);
      color: #f44;
      display: block;
    }
    .admin-panel {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 500;
      padding: 3rem;
      color: white;
      overflow-y: auto;
    }
    .admin-exit {
      background: #333;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
    }
    .voice-btn {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      width: 60px;
      height: 60px;
      background: var(--accent);
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
      z-index: 100;
    }
  </style>
</head>
<body>

  <!-- ONBOARDING -->
  <div class="onboarding" id="onboarding">
    <h1>Что вы ищете?</h1>
    <button onclick="startPath('strength')">Сила</button>
    <button onclick="startPath('endurance')">Выносливость</button>
    <button onclick="startPath('balance')">Баланс</button>
  </div>

  <!-- HEADER -->
  <header>
    <div class="logo">KINETIC</div>
    <nav>
      <a href="#disciplines">Дисциплины</a>
      <a href="#infrastructure">Инфраструктура</a>
      <a href="#team">Команда</a>
      <a href="#contact">Связь</a>
    </nav>
  </header>

  <!-- MAIN -->
  <section id="disciplines">
    <h2 class="section-title">Дисциплины</h2>
    <div class="team-grid">
      <div class="team-card" onclick="openModal('crossfit')">
        <img src="https://via.placeholder.com/300/FF6B35/FFFFFF?text=CrossFit" alt="Кроссфит">
        <div class="team-info">
          <h3>Кроссфит</h3>
          <p>Сила, выносливость, функциональность</p>
        </div>
      </div>
    </div>
  </section>

  <section id="team">
    <h2 class="section-title">Команда</h2>
    <div class="team-grid" id="team-list"></div>
  </section>

  <!-- MODAL -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- ADMIN PANEL -->
  <div class="admin-panel" id="admin-panel">
    <button class="admin-exit" onclick="exitAdmin()">← Назад</button>
    <h2>Админ-панель</h2>
    <p>Управление командой, заявками, настройками.</p>
  </div>

  <!-- VOICE BUTTON -->
  <button class="voice-btn" onclick="toggleVoice()">🎤</button>

  <script>
    // Данные команды
    const teamData = [
      {
        name: "Игорь Мельников",
        role: "Тренер по кроссфиту",
        bio: "Мастер спорта по пауэрлифтингу, 10 лет опыта, тренировал чемпионов Европы.",
        image: "https://via.placeholder.com/300/FF6B35/FFFFFF?text=Игорь"
      }
    ];

    // Онбординг
    function startPath(type) {
      document.getElementById('onboarding').style.display = 'none';
    }

    // Модалка
    function openModal(type) {
      const modal = document.getElementById('modal');
      const body = document.getElementById('modal-body');
      const expert = teamData[0];

      body.innerHTML = `
        <h2>${expert.name}</h2>
        <p><strong>${expert.role}</strong></p>
        <p>${expert.bio}</p>
        <form onsubmit="submitForm(event, '${expert.name}')">
          <input type="hidden" name="service" value="${expert.role}" />
          <input type="text" name="name" placeholder="Ваше имя" required />
          <input type="tel" name="phone" placeholder="Телефон" required />
          <button type="submit" class="cta">Назначить сессию</button>
        </form>
        <div class="form-feedback" id="feedback"></div>
      `;
      modal.classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
    }

    // Форма
    function submitForm(e, name) {
      e.preventDefault();
      const form = e.target;
      const feedback = document.getElementById('feedback');
      feedback.className = 'form-feedback success';
      feedback.textContent = `Спасибо! Сессия с ${name} запланирована. Мы свяжемся с вами.`;
      form.style.display = 'none';
    }

    // Админка
    if (window.location.hash === '#admin') {
      document.getElementById('admin-panel').style.display = 'block';
    }

    function exitAdmin() {
      window.location.hash = '';
      document.getElementById('admin-panel').style.display = 'none';
    }

    // Голос
    function toggleVoice() {
      if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'ru-RU';
        recognition.onresult = (e) => {
          const text = e.results[0][0].transcript.toLowerCase();
          if (text.includes('тренер')) openModal('crossfit');
          if (text.includes('сессия')) openModal('crossfit');
        };
        recognition.start();
      } else {
        alert('Голосовой ввод не поддерживается');
      }
    }

    // Загрузка команды
    window.onload = () => {
      const list = document.getElementById('team-list');
      teamData.forEach(member => {
        list.innerHTML += `
          <div class="team-card" onclick="openModal('coach')">
            <img src="${member.image}" alt="${member.name}" loading="lazy">
            <div class="team-info">
              <h3>${member.name}</h3>
              <p>${member.role}</p>
            </div>
          </div>
        `;
      });
    };
  </script>

</body>
